name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: shine
          POSTGRES_USER: shine
          POSTGRES_PASSWORD: Shine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shine -d shine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ConnectionStrings__ShineDb: Host=localhost;Port=5432;Database=shine;Username=shine;Password=Shine
      Jwt__Secret: historical-placeholder-removed
      Jwt__Issuer: Shine
      Jwt__Audience: Shine.Api
      RabbitMq__Enabled: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Shine.Backend.slnx

      - name: Build
        run: dotnet build Shine.Backend.slnx --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test tests/Shine.UnitTests/Shine.UnitTests.csproj --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage"

      - name: Integration tests
        run: dotnet test tests/Shine.IntegrationTests/Shine.IntegrationTests.csproj --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: '**/TestResults/**/coverage.cobertura.xml'
          if-no-files-found: error
